<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKSEL AKILLI EV SİSTEMLERİ</title>
    <!-- MQTT WebSocket Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .home-icon {
            font-size: 45px;
            color: var(--accent);
            margin-bottom: 5px;
            display: inline-block;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4));
        }

        h1 {
            font-size: 20px;
            margin: 5px 0;
            letter-spacing: 1.5px;
            color: #e2e8f0;
            font-weight: 700;
        }

        h2 {
            font-size: 14px;
            margin: 0;
            color: #94a3b8;
            font-weight: 500;
        }

        /* Login Kartı */
        #login-screen {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 340px;
            box-sizing: border-box;
            border: 1px solid #334155;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
        }

        .pin-input {
            font-size: 22px;
            letter-spacing: 8px;
            text-align: center;
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            color: #0f172a;
            font-weight: bold;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            display: none;
            font-weight: 600;
        }

        /* Panel Stilleri */
        #main-panel {
            display: none;
            width: 100%;
            max-width: 600px;
        }

        .status-bar {
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            border: 1px solid #334155;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 12px;
            color: #e2e8f0;
        }

        .toggle-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-off { background: #334155; color: #94a3b8; }
        .btn-on { background: var(--success); color: white; box-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body>

    <div class="header">
        <div class="home-icon">🏠</div>
        <h1>AKSEL AKILLI EV SİSTEMLERİ</h1>
        <h2>RAFET DEMİR</h2>
    </div>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen">
        <h3 style="margin-top:0; color:#cbd5e1;">Sistem Bağlantısı</h3>
        
        <input type="password" id="pinInput" class="input-field pin-input" maxlength="4" placeholder="••••" inputmode="numeric">
        
        <button class="btn-login" onclick="login()">SİSTEME BAĞLAN</button>
        <div id="error" class="error-msg">Bağlantı Başarısız veya Şifre Hatalı!</div>
    </div>

    <!-- KONTROL PANELİ -->
    <div id="main-panel">
        <div class="status-bar">
            <span id="conn-status" style="color: var(--success);">● Bulut Sunucusuna Bağlı</span>
            <button onclick="logout()" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:12px;">[Çıkış Yap]</button>
        </div>
        <div class="grid" id="button-grid"></div>
    </div>

    <script>
        let currentPin = "";
        let mqttClient = null;
        let isConnected = false;

        // MQTT Yapılandırması
        const MQTT_BROKER = "broker.hivemq.com";
        const MQTT_PORT = 8884; // WebSocket WSS portu
        const TOPIC_COMMAND = "cesme/akilliev/command";
        const TOPIC_STATUS  = "cesme/akilliev/status";

        const channelNames = [
            "1. Havuz Işık", "2. Havuz Jakuzi", "3. Havuz Kobra",
            "4. Merdiven Işık", "5. Sol Bahçe Led", "6. Sağ Bahçe Led",
            "7. Karpuz Işıklar", "8. Yedek 1", "9. Yedek 2",
            "10. Yedek 3", "11. Yedek 4", "12. Yedek 5"
        ];

        // Yerel durum takibi (Varsayılan tüm kanallar kapalı)
        let localStates = new Array(12).fill(false);

        // MQTT İstemcisini Başlat
        function initMQTT() {
            const clientId = "web_aksel_" + Math.random().toString(16).substr(2, 8);
            mqttClient = new Paho.MQTT.Client(MQTT_BROKER, MQTT_PORT, clientId);

            mqttClient.onConnectionLost = onConnectionLost;
            mqttClient.onMessageArrived = onMessageArrived;

            mqttClient.connect({
                useSSL: true,
                onSuccess: onConnectSuccess,
                onFailure: onConnectFailure
            });
        }

        function onConnectSuccess() {
            isConnected = true;
            mqttClient.subscribe(TOPIC_STATUS);
            console.log("MQTT Bulut Sunucusuna Bağlanıldı!");
        }

        function onConnectFailure(err) {
            isConnected = false;
            console.log("MQTT Bağlantı Hatası: ", err);
            showError("Bulut Sunucusuna Bağlanılamadı!");
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("Bağlantı Koparıldı: " + responseObject.errorMessage);
                setTimeout(initMQTT, 3000); // Otomatik yeniden bağlan
            }
        }

        // ESP8266'dan Canlı Durum Geldiğinde Butonları Güncelle
        function onMessageArrived(message) {
            try {
                const data = JSON.parse(message.payloadString);
                if (data.states && Array.isArray(data.states)) {
                    localStates = data.states;
                    renderButtons(localStates);
                }
            } catch (e) {
                console.log("JSON Ayrıştırma Hatası: ", e);
            }
        }

        window.onload = function() {
            setTimeout(initMQTT, 500);
        };

        function login() {
            const pin = document.getElementById("pinInput").value;
            document.getElementById("error").style.display = "none";

            if (!isConnected) {
                showError("Bulut Sunucusu Bağlantısı Bekleniyor...");
                return;
            }

            if (pin.length < 4) {
                showError("Lütfen 4 Haneli PIN Girin!");
                return;
            }

            currentPin = pin;

            // Ekranı panele geçir ve butonları hemen ekrana çiz
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("main-panel").style.display = "block";
            renderButtons(localStates);

            // ESP8266'ya mevcut durumlarını bildirmesi için istek gönder
            const payload = JSON.stringify({ pin: currentPin, request: "status" });
            const message = new Paho.MQTT.Message(payload);
            message.destinationName = TOPIC_COMMAND;
            mqttClient.send(message);
        }

        function renderButtons(states) {
            const grid = document.getElementById("button-grid");
            grid.innerHTML = "";

            channelNames.forEach((name, idx) => {
                const isOn = states[idx];
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-title">${name}</div>
                    <button id="btn-${idx}" class="toggle-btn ${isOn ? 'btn-on' : 'btn-off'}" onclick="toggleRelay(${idx})">
                        ${isOn ? 'AÇIK' : 'KAPALI'}
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function toggleRelay(ch) {
            if (!isConnected) return;

            // Basıldığı an arayüzde anlık görünüm güncellemesi
            localStates[ch] = !localStates[ch];
            renderButtons(localStates);

            // ESP8266'ya komut gönder
            const payload = JSON.stringify({
                pin: currentPin,
                ch: ch
            });

            const message = new Paho.MQTT.Message(payload);
            message.destinationName = TOPIC_COMMAND;
            mqttClient.send(message);
        }

        function showError(msg) {
            const errDiv = document.getElementById("error");
            errDiv.innerText = msg;
            errDiv.style.display = "block";
        }

        function logout() {
            document.getElementById("main-panel").style.display = "none";
            document.getElementById("login-screen").style.display = "block";
            document.getElementById("pinInput").value = "";
        }
    </script>
</body>
</html>
