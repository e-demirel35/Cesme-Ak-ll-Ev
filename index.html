<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKSEL AKILLI EV SİSTEMLERİ</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .home-icon {
            font-size: 45px;
            color: var(--accent);
            margin-bottom: 5px;
            display: inline-block;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4));
        }

        h1 {
            font-size: 20px;
            margin: 5px 0;
            letter-spacing: 1.5px;
            color: #e2e8f0;
            font-weight: 700;
        }

        h2 {
            font-size: 14px;
            margin: 0;
            color: #94a3b8;
            font-weight: 500;
        }

        /* Login Kartı */
        #login-screen {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 340px;
            box-sizing: border-box;
            border: 1px solid #334155;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
        }

        .pin-input {
            font-size: 22px;
            letter-spacing: 8px;
            text-align: center;
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            color: #0f172a;
            font-weight: bold;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            display: none;
            font-weight: 600;
        }

        /* Panel Stilleri */
        #main-panel {
            display: none;
            width: 100%;
            max-width: 600px;
        }

        .status-bar {
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            border: 1px solid #334155;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 12px;
            color: #e2e8f0;
        }

        .toggle-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-off { background: #334155; color: #94a3b8; }
        .btn-on { background: var(--success); color: white; box-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body>

    <div class="header">
        <div class="home-icon">🏠</div>
        <h1>AKSEL AKILLI EV SİSTEMLERİ</h1>
        <h2>RAFET DEMİR</h2>
    </div>

    <!-- GİRİŞ VE SUNUCU AYARLARI EKRANI -->
    <div id="login-screen">
        <h3 style="margin-top:0; color:#cbd5e1;">Sistem Bağlantısı</h3>
        
        <!-- İnternet Üzerinden Bağlantı İçin ESP Adresi (Yerel IP veya Dış Domain/IP) -->
        <input type="text" id="serverUrl" class="input-field" placeholder="Örn: http://akselhome.duckdns.org veya IP">
        <input type="password" id="pinInput" class="input-field pin-input" maxlength="4" placeholder="••••" inputmode="numeric">
        
        <button class="btn-login" onclick="login()">SİSTEME BAĞLAN</button>
        <div id="error" class="error-msg">Bağlantı Başarısız veya Şifre Hatalı!</div>
    </div>

    <!-- KONTROL PANELSİ -->
    <div id="main-panel">
        <div class="status-bar">
            <span id="conn-status" style="color: var(--success);">● Bağlı</span>
            <button onclick="logout()" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:12px;">[Çıkış Yap]</button>
        </div>
        <div class="grid" id="button-grid"></div>
    </div>

    <script>
        let currentPin = "";
        let baseUrl = "";

        const channelNames = [
            "1. Havuz Işık", "2. Havuz Jakuzi", "3. Havuz Kobra",
            "4. Merdiven Işık", "5. Sol Bahçe Led", "6. Sağ Bahçe Led",
            "7. Karpuz Işıklar", "8. Yedek 1", "9. Yedek 2",
            "10. Yedek 3", "11. Yedek 4", "12. Yedek 5"
        ];

        // Sayfa açıldığında kaydedilmiş sunucu adresini hatırla
        window.onload = function() {
            if(localStorage.getItem("esp_url")) {
                document.getElementById("serverUrl").value = localStorage.getItem("esp_url");
            }
        };

        function login() {
            const urlInput = document.getElementById("serverUrl").value.trim();
            const pin = document.getElementById("pinInput").value;
            
            // Format kontrolü (http:// ekle)
            baseUrl = urlInput.startsWith("http") ? urlInput : "http://" + urlInput;
            
            // Sonundaki slash'i temizle
            if (baseUrl.endsWith("/")) baseUrl = baseUrl.slice(0, -1);

            document.getElementById("error").style.display = "none";

            // Dış ağ istekleri için fetch
            fetch(`${baseUrl}/login?pin=${pin}`, { method: 'GET', mode: 'cors' })
            .then(res => res.json())
            .then(data => {
                if(data.status === "OK") {
                    currentPin = pin;
                    localStorage.setItem("esp_url", urlInput); // Adresi hafızaya kaydet
                    
                    document.getElementById("login-screen").style.display = "none";
                    document.getElementById("main-panel").style.display = "block";
                    renderButtons(data.states);
                } else {
                    showError("Hatalı PIN Şifresi!");
                }
            })
            .catch(err => {
                showError("ESP8266 Sunucusuna Ulaşılamadı!");
            });
        }

        function renderButtons(states) {
            const grid = document.getElementById("button-grid");
            grid.innerHTML = "";

            channelNames.forEach((name, idx) => {
                const isOn = states[idx];
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-title">${name}</div>
                    <button id="btn-${idx}" class="toggle-btn ${isOn ? 'btn-on' : 'btn-off'}" onclick="toggleRelay(${idx})">
                        ${isOn ? 'AÇIK' : 'KAPALI'}
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function toggleRelay(ch) {
            fetch(`${baseUrl}/toggle?ch=${ch}&pin=${currentPin}`, { method: 'GET', mode: 'cors' })
            .then(res => res.json())
            .then(data => {
                if(data.status === "OK") {
                    const btn = document.getElementById(`btn-${ch}`);
                    if(data.newState) {
                        btn.className = "toggle-btn btn-on";
                        btn.innerText = "AÇIK";
                    } else {
                        btn.className = "toggle-btn btn-off";
                        btn.innerText = "KAPALI";
                    }
                }
            });
        }

        function showError(msg) {
            const errDiv = document.getElementById("error");
            errDiv.innerText = msg;
            errDiv.style.display = "block";
        }

        function logout() {
            document.getElementById("main-panel").style.display = "none";
            document.getElementById("login-screen").style.display = "block";
        }
    </script>
</body>
</html>
