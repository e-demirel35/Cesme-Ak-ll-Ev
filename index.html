<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akıllı Bahçe & Havuz Kontrol Paneli</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }
    h1 {
      margin-bottom: 20px;
      color: #38bdf8;
      text-align: center;
    }

    /* ŞİFRE GİRİŞ EKRANI STİLLERİ */
    .login-card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
      text-align: center;
      margin-top: 50px;
    }
    .login-card input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1.1rem;
      text-align: center;
      box-sizing: border-box;
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: #0284c7;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .login-card button:hover {
      background-color: #0369a1;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    /* KONTROL PANELİ KART STİLLERİ */
    .grid-container {
      display: none; /* Şifre girilene kadar gizli */
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }
    .card h3 {
      margin: 0 0 10px 0;
      font-size: 1.1rem;
      text-align: center;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #22c55e;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .status {
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #94a3b8;
    }
  </style>

  <!-- Firebase JS SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h1>🏡 Akıllı Bahçe & Havuz Kontrolü</h1>

  <!-- 1. ŞİFRE GİRİŞ EKRANI -->
  <div class="login-card" id="login-box">
    <h3>🔒 Erişim Şifresi</h3>
    <input type="password" id="password-input" placeholder="Şifrenizi girin..." onkeypress="handleKeyPress(event)">
    <button onclick="checkPassword()">Giriş Yap</button>
    <div class="error-msg" id="error-message">Hatalı şifre! Tekrar deneyin.</div>
  </div>

  <!-- 2. RÖLE KONTROL PANELİ -->
  <div class="grid-container" id="relay-container"></div>

  <script>
    // --- GÜNCELLENMİŞ ERİŞİM ŞİFRESİ ---
    const KONTROL_SIFRESI = "1963";

    // --- FIREBASE BAĞLANTI AYARLARI ---
    const firebaseConfig = {
      databaseURL: "https://aksel-9de23-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // --- RÖLE İSİMLENDİRME TABLOSU ---
    const relayNames = [
      "Havuz Işık",         // Röle 1
      "Havuz Jakuzi",       // Röle 2
      "Havuz Kobra",        // Röle 3
      "Merdiven Işık",      // Röle 4
      "Bahçe Led Sol",      // Röle 5
      "Bahçe Led Sağ",      // Röle 6
      "Bahçe Karpuz Işık",  // Röle 7
      "Röle 8",
      "Röle 9",
      "Röle 10",
      "Röle 11",
      "Röle 12",
      "Röle 13",
      "Röle 14",
      "Röle 15",
      "Röle 16"
    ];

    // Oturum kontrolü
    window.onload = function() {
      if (sessionStorage.getItem("authenticated") === "true") {
        showPanel();
      }
    };

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    }

    function checkPassword() {
      const input = document.getElementById("password-input").value;
      const errorMsg = document.getElementById("error-message");

      if (input === KONTROL_SIFRESI) {
        sessionStorage.setItem("authenticated", "true");
        showPanel();
      } else {
        errorMsg.style.display = "block";
      }
    }

    function showPanel() {
      document.getElementById("login-box").style.display = "none";
      const container = document.getElementById("relay-container");
      container.style.display = "grid";

      initPanel();
    }

    function initPanel() {
      const container = document.getElementById('relay-container');
      container.innerHTML = "";

      relayNames.forEach((name, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>${name}</h3>
          <label class="switch">
            <input type="checkbox" id="relay-${index}" onchange="toggleRelay(${index}, this.checked)">
            <span class="slider"></span>
          </label>
          <div class="status" id="status-${index}">KAPALI</div>
        `;
        container.appendChild(card);

        // Firebase Canlı Dinleme
        database.ref(`relays/relay_${index}/state`).on('value', (snapshot) => {
          const state = snapshot.val() || false;
          const checkbox = document.getElementById(`relay-${index}`);
          const statusText = document.getElementById(`status-${index}`);
          
          if (checkbox && statusText) {
            checkbox.checked = state;
            statusText.innerText = state ? "AÇIK" : "KAPALI";
            statusText.style.color = state ? "#22c55e" : "#94a3b8";
          }
        });
      });
    }

    function toggleRelay(index, state) {
      database.ref(`relays/relay_${index}/state`).set(state);
    }
  </script>
</body>
</html>
