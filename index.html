<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akıllı Ev Kontrol Merkezi</title>
    <!-- FontAwesome İkon Kütüphanesi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 15px;
            overflow-x: hidden;
        }

        /* --- ŞİFRE EKRANI (LOCK OVERLAY) --- */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #lock-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .lock-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 340px;
        }

        .lock-icon {
            font-size: 36px;
            color: var(--primary);
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .lock-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .lock-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* PIN Noktaları */
        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .pin-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            transition: 0.2s ease;
        }

        .pin-dot.filled {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        .pin-dot.error {
            background: var(--danger);
            border-color: var(--danger);
            animation: shake 0.3s ease;
        }

        /* Numpad Tuş Takımı */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .key-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 18px;
            font-weight: 600;
            padding: 14px 0;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .key-btn:active {
            transform: scale(0.92);
            background: rgba(56, 189, 248, 0.25);
            border-color: var(--primary);
        }

        /* --- AKILLI EV DASHBOARD --- */
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 18px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
            border-top: 1px solid var(--card-border);
            padding-top: 12px;
        }

        .ip-settings {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            flex: 1;
            max-width: 220px;
        }

        .ip-settings input {
            background: transparent;
            border: none;
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            width: 100%;
            outline: none;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 20px;
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.2);
            white-space: nowrap;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 6px var(--success);
        }

        /* Toplu Buton Grubu */
        .global-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-global {
            flex: 1;
            padding: 12px 10px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s ease;
        }

        .btn-all-on {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #fff;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }

        .btn-all-off {
            background: linear-gradient(135deg, #e11d48, #f43f5e);
            color: #fff;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.2);
        }

        .btn-global:active {
            transform: scale(0.96);
        }

        /* Mobil Uyumlu Grid Arayüzü */
        .relay-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            width: 100%;
        }

        /* Mobil Kart Tasarımı */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 135px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.25s ease;
        }

        .card.active {
            border-color: rgba(56, 189, 248, 0.5);
            background: rgba(30, 41, 59, 0.95);
            box-shadow: 0 8px 20px -5px rgba(56, 189, 248, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--text-muted);
            transition: all 0.25s ease;
        }

        .card.active .card-icon {
            background: var(--primary);
            color: #0f172a;
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 10px;
            line-height: 1.2;
        }

        .card-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .25s ease;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .25s ease;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Animasyon */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Masaüstü Ekranlar İçin İyileştirme */
        @media (min-width: 600px) {
            body { padding: 30px; }
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 20px 25px;
            }
            .header-controls {
                border-top: none;
                padding-top: 0;
                width: auto;
            }
            .relay-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 18px;
            }
            .card {
                height: 150px;
                padding: 18px;
            }
            .card-icon {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
            .card-title {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- 4 HANELİ KİLİT EKRANI -->
    <div id="lock-screen">
        <div class="lock-box">
            <div class="lock-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div class="lock-title">Giriş Doğrulaması</div>
            <div class="lock-subtitle">4 Haneli Şifrenizi Girin</div>
            
            <div class="pin-dots">
                <div class="pin-dot" id="dot-0"></div>
                <div class="pin-dot" id="dot-1"></div>
                <div class="pin-dot" id="dot-2"></div>
                <div class="pin-dot" id="dot-3"></div>
            </div>

            <div class="keypad">
                <button class="key-btn" onclick="pressKey('1')">1</button>
                <button class="key-btn" onclick="pressKey('2')">2</button>
                <button class="key-btn" onclick="pressKey('3')">3</button>
                <button class="key-btn" onclick="pressKey('4')">4</button>
                <button class="key-btn" onclick="pressKey('5')">5</button>
                <button class="key-btn" onclick="pressKey('6')">6</button>
                <button class="key-btn" onclick="pressKey('7')">7</button>
                <button class="key-btn" onclick="pressKey('8')">8</button>
                <button class="key-btn" onclick="pressKey('9')">9</button>
                <button class="key-btn" onclick="clearPin()"><i class="fa-solid fa-rotate-left"></i></button>
                <button class="key-btn" onclick="pressKey('0')">0</button>
                <button class="key-btn" onclick="backspace()"><i class="fa-solid fa-delete-left"></i></button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="container">
        <header>
            <div class="header-top">
                <div class="header-title">
                    <h1><i class="fa-solid fa-house-signal" style="color:var(--primary);"></i> Akıllı Ev</h1>
                    <p>Havuz & Bahçe Kontrolü</p>
                </div>
            </div>
            <div class="header-controls">
                <div class="ip-settings" title="ESP8266 IP Adresi">
                    <i class="fa-solid fa-network-wired" style="color:var(--text-muted); font-size:11px;"></i>
                    <input type="text" id="esp-ip" value="192.168.1.100" onchange="saveIp(this.value)">
                </div>
                <div class="status-badge">
                    <div class="status-dot"></div>
                    <span>Aktif</span>
                </div>
            </div>
        </header>

        <div class="global-controls">
            <button class="btn-global btn-all-on" onclick="setAllRelays(1)">
                <i class="fa-solid fa-power-off"></i> Hepsini Aç
            </button>
            <button class="btn-global btn-all-off" onclick="setAllRelays(0)">
                <i class="fa-solid fa-plug-circle-xmark"></i> Hepsini Kapat
            </button>
        </div>

        <div class="relay-grid" id="grid-container">
            <!-- JavaScript 7 aktif kanalı buraya oluşturacak -->
        </div>
    </div>

    <script>
        const channels = [
            { id: 0, title: "Havuz Işıkları", icon: "fa-solid fa-water-ladder" },
            { id: 1, title: "Havuz Jakuzisi", icon: "fa-solid fa-hot-tub-person" },
            { id: 2, title: "Havuz Kobra", icon: "fa-solid fa-water" },
            { id: 3, title: "Merdiven Işıkları", icon: "fa-solid fa-stairs" },
            { id: 4, title: "Bahçe Sol LED", icon: "fa-solid fa-leaf" },
            { id: 5, title: "Bahçe Sağ LED", icon: "fa-solid fa-tree" },
            { id: 6, title: "Bahçe Karpuz Işıklar", icon: "fa-solid fa-lightbulb" }
        ];

        const CORRECT_PIN = "1234";
        let enteredPin = "";
        let espIp = localStorage.getItem('esp_ip') || '192.168.1.100';

        document.getElementById('esp-ip').value = espIp;

        function saveIp(val) {
            espIp = val.trim();
            localStorage.setItem('esp_ip', espIp);
            syncStatus();
        }

        // PIN KONTROLÜ
        function pressKey(num) {
            if (enteredPin.length < 4) {
                enteredPin += num;
                updateDots();
                if (enteredPin.length === 4) {
                    setTimeout(verifyPin, 150);
                }
            }
        }

        function clearPin() {
            enteredPin = "";
            updateDots();
        }

        function backspace() {
            enteredPin = enteredPin.slice(0, -1);
            updateDots();
        }

        function updateDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < enteredPin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled', 'error');
                }
            }
        }

        function verifyPin() {
            if (enteredPin === CORRECT_PIN) {
                document.getElementById('lock-screen').classList.add('hidden');
                initGrid();
                syncStatus();
                setInterval(syncStatus, 3000);
            } else {
                for (let i = 0; i < 4; i++) {
                    document.getElementById(`dot-${i}`).classList.add('error');
                }
                setTimeout(() => {
                    clearPin();
                }, 400);
            }
        }

        // KONTROL VE İSTEKLER
        function initGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            channels.forEach((ch) => {
                container.innerHTML += `
                    <div class="card" id="card-${ch.id}">
                        <div class="card-header">
                            <div class="card-icon"><i class="${ch.icon}"></i></div>
                            <label class="switch">
                                <input type="checkbox" id="toggle-${ch.id}" onchange="toggleRelay(${ch.id})">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div>
                            <div class="card-title">${ch.title}</div>
                            <div class="card-sub" id="sub-${ch.id}">Kapalı</div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleRelay(id) {
            const chk = document.getElementById(`toggle-${id}`);
            const state = chk.checked ? 1 : 0;
            updateCardUI(id, chk.checked);

            fetch(`http://${espIp}/toggle?id=${id}&state=${state}`)
                .catch(err => console.log("ESP İletişim Hatası:", err));
        }

        function setAllRelays(state) {
            channels.forEach(ch => {
                const chk = document.getElementById(`toggle-${ch.id}`);
                if(chk) {
                    chk.checked = (state === 1);
                    updateCardUI(ch.id, state === 1);
                }
            });

            fetch(`http://${espIp}/all?state=${state}`)
                .catch(err => console.log("ESP İletişim Hatası:", err));
        }

        function updateCardUI(id, isActive) {
            const card = document.getElementById(`card-${id}`);
            const sub = document.getElementById(`sub-${id}`);
            if (isActive) {
                card.classList.add('active');
                sub.innerText = "Açık";
                sub.style.color = "var(--primary)";
            } else {
                card.classList.remove('active');
                sub.innerText = "Kapalı";
                sub.style.color = "var(--text-muted)";
            }
        }

        function syncStatus() {
            fetch(`http://${espIp}/status`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.states) {
                        channels.forEach(ch => {
                            const isOn = (data.states[ch.id] === 1);
                            const chk = document.getElementById(`toggle-${ch.id}`);
                            if (chk) chk.checked = isOn;
                            updateCardUI(ch.id, isOn);
                        });
                    }
                })
                .catch(err => console.log("Senkronizasyon bekleniyor..."));
        }
    </script>
</body>
</html>
